name: CI/CD Filter Pipeline

on:
  schedule:
    # Run once daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Check for changes between workspace and main
        id: check
        run: |
          git fetch origin main workspace
          # Check if there are any differences between workspace and main
          if git diff --quiet origin/main origin/workspace -- filters-PC.txt filters-Mobile.txt; then
            echo "No changes detected in filter files"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in filter files"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  test-rules:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      # Setup pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Capture Playwright version
        id: pw-version
        run: |
          VERSION=$(grep -oP '"@playwright/test":\s*"\^?\K[0-9.]+' package.json)
          if [ -z "$VERSION" ]; then
            echo "Could not determine Playwright version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install Playwright Browsers (Chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm exec playwright test --reporter=json,html

  release-filters:
    needs: test-rules
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/workspace'
    
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main 
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "FilterBot"
          git config --global user.email "bot@my-uBlock-filters.local"

      - name: Merge Workspace into Main
        run: |
          git merge origin/workspace --no-ff -m "Merge updates from workspace"

      - name: Update Version Headers
        run: |
          NEW_VERSION=$(date -u +"%Y%m%d%H%M")
          NEW_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Loop through both filter files
          for file in filters-PC.txt filters-Mobile.txt; do
            if [ -f "$file" ]; then
              sed -i "s/^! Version:.*/! Version: $NEW_VERSION/" "$file"
              sed -i "s/^! Last modified:.*/! Last modified: $NEW_DATE/" "$file"
              echo "Updated header for $file"
            fi
          done

      - name: Commit and Push to Production
        run: |
          git add filters-PC.txt filters-Mobile.txt
          git commit -m "Release: Update version headers to $(date -u +'%Y%m%d%H%M')"
          git push origin main