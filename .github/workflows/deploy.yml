name: Deploy & Release Filters

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force release even if no filter changes are detected"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-24.04
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for changes between the selected branch and main
        id: check
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Force release requested"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          # main has no diff to detect; dispatching it publishes (re-stamps headers).
          if [ "$BRANCH" = "main" ]; then
            echo "Releasing main"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet origin/main HEAD -- filters-PC.txt filters-Mobile.txt; then
            echo "No changes detected in filter files"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in filter files"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  test-rules:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Capture Playwright version
        id: pw-version
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/[\^~]/, '')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: cache-pw
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright dependencies (Chromium)
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright Browsers (Chromium only)
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Run Playwright tests
        run: pnpm exec playwright test --project=chromium --reporter=github,html

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release-filters:
    needs: test-rules
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "FilterBot"
          git config --global user.email "bot@my-uBlock-filters.local"

      - name: Merge selected branch into main
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$BRANCH" != "main" ]; then
            git fetch origin "$BRANCH"
            git merge "$SHA" --no-ff -m "Merge updates from $BRANCH"
          fi

      - name: Update Version Headers
        run: |
          NEW_VERSION=$(date -u +"%Y%m%d%H%M")
          NEW_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Loop through both filter files
          for file in filters-PC.txt filters-Mobile.txt; do
            if [ -f "$file" ]; then
              sed -i "s/^! Version:.*/! Version: $NEW_VERSION/" "$file"
              sed -i "s/^! Last modified:.*/! Last modified: $NEW_DATE/" "$file"
              echo "Updated header for $file"
            fi
          done

      - name: Commit and Push to Production
        run: |
          git add filters-PC.txt filters-Mobile.txt
          if ! git diff --cached --quiet; then
            git commit -m "Release: Update version headers to $(date -u +'%Y%m%d%H%M')"
          else
            echo "Headers already current; skipping header commit"
          fi
          git push origin main
