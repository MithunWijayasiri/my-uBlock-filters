name: CI/CD Filter Pipeline

on:
  schedule:
    # Run once daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for changes between workspace and main
        id: check
        run: |
          git fetch origin main workspace
          # Check if there are any differences between workspace and main
          if git diff --quiet origin/main origin/workspace -- filters-PC.txt filters-Mobile.txt; then
            echo "No changes detected in filter files"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in filter files"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  test-rules:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Setup pnpm
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test --reporter=json,html

  release-filters:
    needs: test-rules
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/workspace'
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main 
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "FilterBot"
          git config --global user.email "bot@my-uBlock-filters.local"

      - name: Merge Workspace into Main
        run: |
          git merge origin/workspace --no-ff -m "Merge updates from workspace"

      - name: Update Version Headers
        run: |
          NEW_VERSION=$(date -u +"%Y%m%d%H%M")
          NEW_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Loop through both filter files
          for file in filters-PC.txt filters-Mobile.txt; do
            if [ -f "$file" ]; then
              sed -i "s/^! Version:.*/! Version: $NEW_VERSION/" "$file"
              sed -i "s/^! Last modified:.*/! Last modified: $NEW_DATE/" "$file"
              echo "Updated header for $file"
            fi
          done

      - name: Commit and Push to Production
        run: |
          git add filters-PC.txt filters-Mobile.txt
          git commit -m "Release: Update version headers to $(date -u +'%Y%m%d%H%M')"
          git push origin main