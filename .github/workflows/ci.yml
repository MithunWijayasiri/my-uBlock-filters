name: CI

on:
  pull_request:
    branches: [main, workspace]
  push:
    branches: [main, workspace]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint and format check
        run: pnpm run lint

  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Capture Playwright version
        id: pw-version
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/[\^~]/, '')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: cache-pw
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright dependencies (Chromium)
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright Browsers (Chromium only)
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=chromium --reporter=github,html

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
